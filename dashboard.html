        <div class="stats">${a.request_robux>0?`<div class="rbx">Asking ${a.request_robux.toLocaleString()}</div>`:'<div class="rbx">Robux accepted</div>'}</div></div>
    </div>
    <a class="trade" href="${a.trade_url}" target="_blank">Open trade window</a></div>`;
}).join('');
</script></body></html>
