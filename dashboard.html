function slot(i){return i.thumb?`<div class="slot"><img src="${i.thumb}" title="${i.name}"></div>`:'<div class="slot"></div>'}
function tag(t){return `<div class="slot"><img src="${t.icon}" title="${t.name}"><div class="tagname">${t.name}</div></div>`}
